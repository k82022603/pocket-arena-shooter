# 웹 앱을 GitHub Pages에 올린다 (수동 실행 전용).
# 사전 준비: 저장소 Settings → Pages → Source를 "GitHub Actions"로,
#           Settings → Secrets and variables → Actions → Variables에 SIGNALING_URL (예: wss://pocket-arena-signaling.onrender.com) 추가.
name: Deploy web to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SIGNALING_URL: ${{ vars.SIGNALING_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
